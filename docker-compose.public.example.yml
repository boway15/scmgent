# 公网专用机 override 示例（Win11 + Cloudflare Tunnel）
#
# 用法：
#   copy docker-compose.public.example.yml docker-compose.public.yml
#   编辑 docker-compose.public.yml（域名、密钥、飞书）
#   docker compose -f docker-compose.yml -f docker-compose.public.yml up -d --build
#
# docker-compose.public.yml 已加入 .gitignore，避免密钥进仓库。

services:
  web:
    environment:
      # 与 Cloudflare Tunnel 子域名一致，无末尾斜杠
      APP_BASE_URL: https://scm.al6s.cn

      # 登录策略：必须登录；邮箱 + 飞书（需配置 FEISHU_*）
      AUTH_REQUIRE_LOGIN: "true"
      EMAIL_AUTH_ENABLED: "true"
      FEISHU_AUTH_ENABLED: "true"

      # JWT_SECRET / CRON_SECRET / FEISHU_APP_ID / FEISHU_APP_SECRET → 写在 .env
      # 勿在此写 cli_xxxxxxxx 等占位符：Compose environment 优先级高于 env_file，会覆盖 .env

      # 超管密码见 docker-compose.yml 默认 BOOTSTRAP_ADMIN_PASSWORD（admin123456）

      # 飞书 OAuth 回调（须与飞书开放平台重定向 URL 完全一致）
      FEISHU_OAUTH_REDIRECT_URI: https://scm.al6s.cn/api/auth/feishu/callback

      # 库存总览 / 采购飞书多维表格（与 .env 二选一；勿留空字符串，否则会覆盖 .env）
      # FEISHU_BITABLE_PROCUREMENT_APP_TOKEN: "HPJzbHdPea7elSs92T8c31BTnxe"
      # FEISHU_BITABLE_TABLE_INVENTORY: "tblwvSHbqJ3szugE"
      # FEISHU_BITABLE_TABLE_INVENTORY_QUERY: "tblubb08s6pe6DXI"

  # cron 的 CRON_SECRET 与 web 共用 .env 或 docker-compose.yml 默认值
  cron:
    environment:
      CRON_ENABLED: "true"
      CRON_BASE_URL: http://web:8081
